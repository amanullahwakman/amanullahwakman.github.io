<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amanullah Wakman | Academic CV</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #525659;
}

.viewer-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 58px;
    z-index: 1000;
    background: #102a43;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
}

.viewer-title {
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.download-button {
    background: white;
    color: #102a43;
    text-decoration: none;
    padding: 9px 14px;
    border-radius: 5px;
    font-weight: bold;
    font-size: 14px;
}

.download-button:hover {
    background: #e8eef3;
}

.pdf-area {
    padding-top: 58px;
    width: 100%;
    min-height: 100vh;
}

.pdf-frame {
    width: 100%;
    height: calc(100vh - 58px);
    min-height: 800px;
    border: none;
    display: block;
}
</style>
</head>

<body>

<div class="viewer-header">

<div class="viewer-title">
Amanullah Wakman — Academic CV
</div>

<a
class="download-button"
href="Amanullah_Wakman_Academic_CV.pdf"
download>
Download PDF
</a>

</div>

<div class="pdf-area">

<iframe
class="pdf-frame"
src="Amanullah_Wakman_Academic_CV.pdf#toolbar=1&navpanes=0&scrollbar=1"
title="Amanullah Wakman Academic CV">
</iframe>

</div>

</body>
</html>
