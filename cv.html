<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amanullah Wakman | Academic CV</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #525659;
    font-family: Arial, Helvetica, sans-serif;
}

.viewer-header {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: 58px;
    background: #102a43;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
}

.viewer-title {
    font-size: 16px;
    font-weight: bold;
}

.download-button {
    background: white;
    color: #102a43;
    text-decoration: none;
    padding: 9px 15px;
    border-radius: 5px;
    font-size: 14px;
    font-weight: bold;
}

.download-button:hover {
    background: #e6edf3;
}

#pdf-viewer {
    width: 100%;
    padding: 20px 10px 40px;
}

.pdf-page {
    display: block;
    margin: 0 auto 20px;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    max-width: 100%;
    height: auto;
}

.loading {
    color: white;
    text-align: center;
    padding: 40px 20px;
    font-size: 16px;
}
</style>

</head>

<body>

<div class="viewer-header">

<div class="viewer-title">
Amanullah Wakman — Academic CV
</div>

<a
class="download-button"
href="Amanullah_Wakman_Academic_CV.pdf"
download>
Download PDF
</a>

</div>

<div id="pdf-viewer">
<div class="loading">Loading Academic CV...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const pdfUrl = "Amanullah_Wakman_Academic_CV.pdf";
const viewer = document.getElementById("pdf-viewer");

pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {

    viewer.innerHTML = "";

    for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

        pdf.getPage(pageNumber).then(function(page) {

            const viewport = page.getViewport({ scale: 1.5 });

            const canvas = document.createElement("canvas");
            canvas.className = "pdf-page";

            const context = canvas.getContext("2d");

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            viewer.appendChild(canvas);

            page.render({
                canvasContext: context,
                viewport: viewport
            });

        });

    }

}).catch(function(error) {

    viewer.innerHTML =
    "<div class='loading'>Unable to display the CV. Please use the Download PDF button above.</div>";

    console.error(error);

});
</script>

</body>
</html>
